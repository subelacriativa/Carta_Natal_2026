
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#10251e">

<title>🎅 Surpresa de Natal 🎅</title>

<!-- Fontes -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    overflow-x: hidden;
    font-family: 'Montserrat', sans-serif;
    color: #fff;
    background:
      radial-gradient(ellipse at top, #285b43 0%, transparent 55%),
      linear-gradient(150deg, #071b15, #123b2c 60%, #071b15);
}

/* NEVE */

.snow {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 10;
    overflow: hidden;
}

.snow span {
    position: absolute;
    top: -20px;
    color: white;
    opacity: .8;
    animation: snowfall linear infinite;
}

@keyframes snowfall {
    to {
        transform: translateY(110vh) rotate(360deg);
    }
}

/* LAYOUT */

.container {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 35px 20px;
    text-align: center;
    position: relative;
}

h1 {
    font-family: 'Great Vibes', cursive;
    font-size: clamp(42px, 8vw, 68px);
    color: #f8d98a;
    font-weight: normal;
    text-shadow: 0 0 20px #d9a44177;
}

.subtitle {
    font-size: 13px;
    letter-spacing: 3px;
    color: #e8e2c9;
    margin: 15px 0 25px;
    text-transform: uppercase;
}

p {
    line-height: 1.8;
}

/* BOTÕES */

.btn {
    border: 1px solid #f6d78b;
    background: linear-gradient(135deg, #d6a64f, #f6dc9b);
    color: #452c12;
    padding: 15px 30px;
    border-radius: 40px;
    font-family: 'Montserrat', sans-serif;
    font-weight: 700;
    font-size: 14px;
    cursor: pointer;
    transition: .3s;
    box-shadow: 0 5px 25px #d6a64f44;
}

.btn:hover {
    transform: scale(1.05);
    box-shadow: 0 5px 35px #e9c87588;
}

/* TELAS */

.screen {
    display: none;
    width: 100%;
    max-width: 650px;
    animation: appear 1s ease;
}

.screen.active {
    display: flex;
    flex-direction: column;
    align-items: center;
}

.screen.active .letter {
    display: block;
}

@keyframes appear {
    from {
        opacity: 0;
        transform: translateY(20px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

/* VÍDEO */

.video-box {
    width: 100%;
    max-width: 520px;
    border: 2px solid #d9b76c;
    border-radius: 18px;
    overflow: hidden;
    background: #000;
    box-shadow: 0 0 35px #d9b76c33;
    margin-bottom: 25px;
}

video {
    display: block;
    width: 100%;
    max-height: 65vh;
    object-fit: contain;
}

/* ENVELOPE */

.envelope-area {
    margin: 35px auto;
    cursor: pointer;
    perspective: 1000px;
}

.envelope {
    width: min(280px, 75vw);
    height: 185px;
    position: relative;
    background: linear-gradient(135deg, #f2d28d, #c79642);
    border-radius: 5px;
    box-shadow: 0 15px 40px #0008;
    transition: transform .5s;
}

.envelope:hover {
    transform: translateY(-8px);
}

.envelope::before {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(140deg, transparent 49%, #d5ad60 50%);
    clip-path: polygon(0 0, 100% 0, 50% 60%);
    z-index: 3;
}

.envelope::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(35deg, #b98535, #f3d99c);
    clip-path: polygon(0 100%, 50% 43%, 100% 100%);
    z-index: 4;
}

.seal {
    position: absolute;
    z-index: 5;
    top: 48%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 48px;
    height: 48px;
    border-radius: 50%;
    background: #9c1f28;
    color: #f7d78c;
    display: grid;
    place-items: center;
    font-size: 24px;
    box-shadow: 0 3px 12px #0005;
}

.envelope-hint {
    margin-top: 22px;
    color: #f5d88f;
    font-size: 14px;
    animation: pulse 1.5s infinite;
}

@keyframes pulse {
    50% { opacity: .45; }
}

/* CARTA */

.letter {
    display: none;
    width: 100%;
    max-width: 530px;
    min-height: 420px;
    padding: 42px 28px;
    margin: 20px auto;
    position: relative;
    overflow: hidden;
    color: #604323;
    border: 3px double #c69b52;
    border-radius: 4px;
    background:
      radial-gradient(ellipse at 10% 10%, #fff9d8, transparent 45%),
      radial-gradient(ellipse at 90% 90%, #f0dcae, transparent 45%),
      linear-gradient(135deg, #fff8df, #f3e2b8);
    box-shadow: 0 15px 50px #0008;
    animation: letterOpen 1.2s ease forwards;
}

.letter::before {
    content: "✦  ✧  ✦  ✧  ✦";
    position: absolute;
    top: 15px;
    left: 0;
    right: 0;
    text-align: center;
    color: #c49a4e;
    letter-spacing: 10px;
    opacity: .8;
}

.letter::after {
    content: "✧  ✦  ✧  ✦  ✧";
    position: absolute;
    bottom: 15px;
    left: 0;
    right: 0;
    text-align: center;
    color: #c49a4e;
    letter-spacing: 10px;
    opacity: .8;
}

@keyframes letterOpen {
    from {
        opacity: 0;
        transform: scale(.75) rotateX(15deg);
    }
    to {
        opacity: 1;
        transform: scale(1) rotateX(0);
    }
}

.letter h2 {
    font-family: 'Great Vibes', cursive;
    font-size: 42px;
    font-weight: normal;
    color: #9b672d;
    margin: 15px 0 25px;
}

.message {
    font-family: 'Great Vibes', cursive;
    font-size: clamp(25px, 5vw, 32px);
    line-height: 1.7;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    text-align: center;
}

.signature {
    font-family: 'Great Vibes', cursive;
    font-size: 31px;
    color: #a26d32;
    margin-top: 30px;
}

.footer {
    margin-top: 35px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 2px;
    color: #9b672d;
    text-align: center;
}

/* RESPONSIVO */

@media(max-width: 480px) {
    .container {
        padding: 25px 16px;
    }

    .letter {
        padding: 40px 20px;
    }

    .subtitle {
        font-size: 11px;
        letter-spacing: 2px;
    }
}
</style>
</head>

<body>

<div class="snow" id="snow"></div>

<main class="container">

    <!-- TELA 1: BOAS-VINDAS -->

    <section class="screen active" id="welcome">

        <h1>Ho Ho Ho!</h1>

        <br></br>

        <p>
            Olá! Tenho uma mensagem muito especial
            para você!
        </p>

        <br></br>

        <br>

        <button class="btn" onclick="startVideo()">
            🎅 Assistir à mensagem
        </button>

    </section>


    <!-- TELA 2: VÍDEO -->

    <section class="screen" id="videoScreen">

        <h1>Uma mensagem do Papai Noel</h1>

        <p class="subtitle">
        </p>

        <div class="video-box">

            <video id="santaVideo" playsinline controls
                   preload="metadata">
                <source src="papai-noel.mp4" type="video/mp4">
                Seu navegador não suporta vídeos.
            </video>

        </div>

        <p>
        </p>

        <button class="btn" id="continueBtn"
                onclick="showEnvelope()" hidden>
            Ler a cartinha
        </button>

    </section>


    <!-- TELA 3: ENVELOPE -->

    <section class="screen" id="envelopeScreen">

        <h1>Uma última surpresa...</h1>

        <p>
        </p>

        <div class="envelope-area"
             onclick="openLetter()"
             role="button"
             tabindex="0"
             aria-label="Abrir a carta"
             onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();openLetter();}">

            <div class="envelope">
                <div class="seal">♥</div>
            </div>

            <div class="envelope-hint">
                ✨ Toque no envelope para abrir ✨
            </div>

        </div>

    </section>


    <!-- TELA 4: CARTA -->

    <section class="screen" id="letterScreen">

    <div class="letter">

        <h2>Uma mensagem para você...</h2>

        <div class="message" id="personalMessage">
            Que a magia do Natal ilumine
            seus dias e encha seu coração
            de alegria!
        </div>

        <div class="signature" id="signature">
            Com carinho ❤️
        </div>

        <p class="footer">
            ✨ QUE SEU NATAL SEJA MÁGICO ✨
        </p>

    </div>

</section>

</main>

<script>

// =====================================
// TROCA DE TELAS
// =====================================

function showScreen(id) {

    document.querySelectorAll('.screen').forEach(screen => {
        screen.classList.remove('active');
    });

    document.getElementById(id).classList.add('active');

    window.scrollTo({
        top: 0,
        behavior: 'smooth'
    });
}


// =====================================
// INICIAR VÍDEO
// =====================================

const video = document.getElementById('santaVideo');

function startVideo() {

    showScreen('videoScreen');

    video.currentTime = 0;

    video.play().catch(() => {
        // Se o navegador bloquear a reprodução,
        // o usuário poderá apertar o play no vídeo.
    });
}


// =====================================
// FINAL DO VÍDEO
// =====================================

video.addEventListener('ended', function() {

    document.getElementById('continueBtn').hidden = false;

});

function showEnvelope() {

    showScreen('envelopeScreen');

}


// =====================================
// ABRIR A CARTA
// =====================================

function openLetter() {

    showScreen('letterScreen');

}


// =====================================
// ANIMAÇÃO DE NEVE
// =====================================

const snow = document.getElementById('snow');

for (let i = 0; i < 55; i++) {

    const flake = document.createElement('span');

    flake.textContent = '❄';

    flake.style.left = Math.random() * 100 + '%';

    flake.style.fontSize =
        (Math.random() * 12 + 8) + 'px';

    flake.style.animationDuration =
        (Math.random() * 8 + 5) + 's';

    flake.style.animationDelay =
        (Math.random() * 8) + 's';

    snow.appendChild(flake);

}

</script>

</body>
</html>
